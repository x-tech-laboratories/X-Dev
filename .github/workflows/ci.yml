name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The gates compare a pull request with the branch it goes into.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build
      - run: npm run coverage
      - run: git diff --exit-code vitest.config.ts
      - run: npm run lint
      - if: github.event_name == 'pull_request'
        run: npm run check -- --base origin/${{ github.base_ref }}
